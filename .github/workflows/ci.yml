name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No dependency is installed on purpose: the tests and the replay use the
      # standard library only. Playwright is imported lazily by the live path.
      - name: Unit tests and replay on captured data
        run: |
          python -m unittest discover -s tests -t . -v
          python scripts/diagnostic.py --rejeu fixtures/real
